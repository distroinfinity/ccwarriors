name: health
# Prod health checks every 10 minutes. On failure, opens (or updates) a
# "health-alert" issue so the repo owner gets a GitHub notification;
# auto-closes it when everything recovers.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run health checks
        id: checks
        run: |
          set -u
          report="$RUNNER_TEMP/report.md"
          : > "$report"
          failed=0
          check() {
            name="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "- ✅ $name" >> "$report"
            else
              echo "- ❌ **$name**" >> "$report"
              failed=1
            fi
          }

          check "API /health"        curl -fsS -m 10 https://api.ccwarriors.xyz/health
          check "leaderboard API"    curl -fsS -m 10 "https://api.ccwarriors.xyz/leaderboard?limit=1"
          check "install.sh served"  sh -c 'curl -fsS -m 10 https://api.ccwarriors.xyz/install.sh | head -1 | grep -q bash'
          check "install.ps1 served" curl -fsS -m 10 -o /dev/null https://api.ccwarriors.xyz/install.ps1
          check "cli.js served"      sh -c 'curl -fsS -m 10 https://api.ccwarriors.xyz/cli.js | head -1 | grep -q node'
          # Self-update health: /cli/version must advertise a real commit SHA
          # (7 hex chars), not `local-<date>` or `unknown`. A non-SHA id means a
          # deploy stamped a non-propagating build and the fleet's self-update
          # has silently stalled — the exact failure that strands old clients.
          check "cli build id is a commit" sh -c 'curl -fsS -m 10 https://api.ccwarriors.xyz/cli/version | grep -Eq "\"buildId\":\"[0-9a-f]{7}\""'
          # Installs AND executes the CLI — download-only checks miss runtime
          # breakage (e.g. the ESM cli.js crashing without its package.json marker).
          check "end-to-end install" env HOME="$RUNNER_TEMP/ccw-e2e" CCWARRIORS_NO_RUN=1 CCWARRIORS_TELEMETRY=0 \
            bash -c 'mkdir -p "$HOME" && curl -fsSL https://api.ccwarriors.xyz/install.sh | bash \
              && test -f "$HOME/.ccwarriors/package.json" \
              && "$HOME/.ccwarriors/bin/ccwarriors" --version'
          check "telemetry endpoint"  curl -fsS -m 10 -X POST https://api.ccwarriors.xyz/telemetry \
            -H 'content-type: application/json' -d '{"event":"health_check","distinctId":"gh-health","props":{"os":"ci"}}'
          check "websocket upgrade"   sh -c 'code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 --http1.1 \
            -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Version: 13" \
            -H "Sec-WebSocket-Key: aGVhbHRoY2hlY2sxMjM0NQ==" https://api.ccwarriors.xyz/); [ "$code" = "101" ]'
          check "website (deployment)" sh -c 'curl -fsS -m 10 https://ccwarriors.vercel.app/ | grep -qi "<div id=\"root\"\|ccwarriors"'

          # Alert when real users' installs are failing (installer beacons land
          # in the server's rolling window at /telemetry/failures). This is how
          # we hear about breakage like the Node 20/21 ESM crash without a DM.
          # node_missing/node_old are the installer's environment gate doing its
          # job (user's machine lacks Node 20+) — informational, not prod
          # breakage. They only alert on a spike (≥3/hour), which would suggest
          # the version gate itself regressed and is rejecting everyone.
          tel=$(curl -fsS -m 10 https://api.ccwarriors.xyz/telemetry/failures || echo ERR)
          if ! jq -e '.byStepLastHour' >/dev/null 2>&1 <<<"$tel"; then
            echo "- ❌ **install-failure telemetry unreachable** (\`/telemetry/failures\`)" >> "$report"
            failed=1
          else
            steps=$(jq -cr '.byStepLastHour' <<<"$tel")
            env_fails=$(jq -r '[(.byStepLastHour["node_missing"] // 0), (.byStepLastHour["node_old"] // 0)] | add' <<<"$tel")
            real_fails=$(jq -r '[.byStepLastHour | to_entries[] | select(.key != "node_missing" and .key != "node_old") | .value] | add // 0' <<<"$tel")
            if [ "$real_fails" -ge 1 ]; then
              echo "- ❌ **$real_fails user install failure(s) in the last hour** — by step: \`$steps\`" >> "$report"
              failed=1
            elif [ "$env_fails" -ge 3 ]; then
              echo "- ❌ **$env_fails Node-version rejections in the last hour** — possible version-gate regression — by step: \`$steps\`" >> "$report"
              failed=1
            elif [ "$env_fails" -ge 1 ]; then
              echo "- ✅ no install breakage *(ℹ️ $env_fails visitor(s) bounced by the Node 20+ gate: \`$steps\` — expected behavior)*" >> "$report"
            else
              echo "- ✅ user install failures (last hour): 0" >> "$report"
            fi
          fi

          # Stale autosync daemons (issue #91): a self-update that installs the
          # new bundle but never relaunches it leaves a daemon silently dead —
          # invisible client-side (it emits no beacon), so the server exposes the
          # cohort. Alert only on a sustained spike (>=5 daemons AND >=40% silent
          # >12h, suggesting a release-wide relaunch failure); normal idle laptops
          # never page. The raw numbers are always reported.
          dmn=$(curl -fsS -m 10 https://api.ccwarriors.xyz/telemetry/stale-daemons || echo ERR)
          if ! jq -e '.daemonUsers' >/dev/null 2>&1 <<<"$dmn"; then
            echo "- ❌ **stale-daemon telemetry unreachable** (\`/telemetry/stale-daemons\`)" >> "$report"
            failed=1
          else
            du=$(jq -r '.daemonUsers' <<<"$dmn")
            s12=$(jq -r '.silent12h' <<<"$dmn")
            ratio=$(( du > 0 ? s12 * 100 / du : 0 ))
            worst=$(jq -r '[.stale[:3][] | "\(.githubLogin)(\(.silentHours)h/\(.lastBuild // "?"))"] | join(", ")' <<<"$dmn")
            if [ "$s12" -ge 5 ] && [ "$ratio" -ge 40 ]; then
              echo "- ❌ **$s12/$du daemon users silent >12h ($ratio%)** — possible self-update relaunch failure (#91): $worst" >> "$report"
              failed=1
            else
              echo "- ✅ stale daemons: $s12/$du silent >12h ($ratio%)" >> "$report"
            fi
          fi

          # Informational only — the Vercel apex challenge cycles on its own.
          apex=$(curl -s -o /dev/null -w "%{http_code}" -m 10 https://ccwarriors.xyz/install.sh || echo ERR)
          echo "- ℹ️ apex \`ccwarriors.xyz/install.sh\` → HTTP $apex *(Vercel challenge cycles; not alerting)*" >> "$report"

          # Silent-daemon alert (#91): active users whose sync went stale are
          # likely dead daemons. Page when the 24h count crosses the threshold.
          fleet=$(curl -fsS -m 10 https://api.ccwarriors.xyz/telemetry/fleet || echo ERR)
          if jq -e '.silent24h' >/dev/null 2>&1 <<<"$fleet"; then
            s24=$(jq -r '.silent24h | floor' <<<"$fleet")
            # Threshold 8: more than a handful of *active* daemons going dark for
            # a full day is well beyond coincidental idleness on a ~50-100 user
            # fleet — it signals a relaunch/self-update regression, not a few
            # closed laptops. Revisit as a fraction of `.active` (e.g. >15%) once
            # the fleet outgrows a fixed count.
            if [ "$s24" -ge 8 ]; then
              echo "- ❌ **$s24 active daemons silent >24h** — possible self-update/relaunch regression (\`/telemetry/fleet\`)" >> "$report"
              failed=1
            else
              echo "- ✅ silent active daemons (>24h): $s24" >> "$report"
            fi
          fi

          echo "---" >> "$report"
          echo "[Run log](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$report"
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Alert — open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create health-alert --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Automated prod health alerts" 2>/dev/null || true
          body="$(printf '🔴 Prod health check failed at %s UTC\n\n%s' "$(date -u '+%Y-%m-%d %H:%M')" "$(cat "$RUNNER_TEMP/report.md")")"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label health-alert --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label health-alert \
              --title "🔴 Prod health check failing" --body "$body"
          fi

      - name: Recovery — close incident issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label health-alert --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ All checks passing again at $(date -u '+%Y-%m-%d %H:%M') UTC — auto-closing."
          fi
